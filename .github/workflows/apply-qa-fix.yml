name: Finalize requested QA fixes
on:
  push:
    branches: [fix/restore-premium-motion]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize requested scope
        shell: bash
        run: |
          git merge-base --is-ancestor aad62d21683da71341a88bafe6875f9e033e0413 HEAD
          git checkout aad62d21683da71341a88bafe6875f9e033e0413 -- .github/workflows/site-quality.yml
          python3 - <<'PY'
          from pathlib import Path
          tests = Path('tests/site.spec.mjs')
          text = tests.read_text()
          injected = "await page.addInitScript(()=>{const nativeMatchMedia=window.matchMedia.bind(window);window.matchMedia=query=>query.replace(/\\s/g,'')==='(pointer:fine)'?{matches:true,media:query,onchange:null,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){},dispatchEvent(){return true}}:nativeMatchMedia(query)});"
          assert text.count(injected) == 1
          text = text.replace(injected, '')
          assert text.count("test('tablet project cards stay separated and contain every direct child'") == 1
          assert text.count("test('tablet project cards") == 1
          tests.write_text(text)
          proof = Path('proof/index.html').read_text()
          assert proof.count('target="_blank" rel="noopener noreferrer"') == 2
          assert 'target="_blank" rel="noopener"' not in proof
          index = Path('index.html').read_text()
          assert index.count('<strong>3.11+</strong><span>Python requirement</span>') == 1
          assert '<strong>v0.6.0</strong><span>documented release</span>' not in index
          PY
      - name: Run static verification
        run: npm test
      - name: Run tablet geometry verification
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=tablet-768 --grep "tablet project cards stay separated"
      - name: Squash onto supplied head and push
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
        run: |
          rm .github/workflows/apply-qa-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset --soft aad62d21683da71341a88bafe6875f9e033e0413
          git commit -m "fix: harden evidence links and tablet card QA"
          git push --force-with-lease=refs/heads/fix/restore-premium-motion:${EXPECTED_REMOTE_HEAD} origin HEAD:fix/restore-premium-motion
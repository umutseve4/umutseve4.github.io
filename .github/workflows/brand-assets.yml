name: brand-assets

# The vector master is the only hand-authored brand file.
# Every raster below is derived from it, so the mark can never drift
# between surfaces. Change brand/zift.svg -> all assets regenerate.

on:
  push:
    branches: [main]
    paths:
      - 'brand/zift.svg'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install renderers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            librsvg2-bin imagemagick fonts-dejavu-core python3-pil
          rsvg-convert --version
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
          fc-list | grep -i "dejavu.*mono" || true

      - name: Derive the icon crop from the master
        run: |
          python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path('brand/zift.svg').read_text()
          m = re.search(r'<view id="mark" viewBox="([^"]+)"', src)
          assert m, 'master svg must carry the <view id="mark"> crop'
          crop = m.group(1)
          mark = re.sub(r'viewBox="0 0 512 512"', f'viewBox="{crop}"', src, count=1)
          pathlib.Path('brand/zift-mark.svg').write_text(mark)
          print('mark viewBox =', crop)
          PY

      - name: Render PNG set
        run: |
          set -e
          # full lockup - transparent
          for s in 1024 512 256; do
            rsvg-convert -w $s -h $s brand/zift.svg -o brand/zift-$s.png
          done
          # icon crop - avatars and favicons
          for s in 512 192 180 128 48 32 16; do
            rsvg-convert -w $s -h $s brand/zift-mark.svg -o brand/zift-mark-$s.png
          done
          cp brand/zift-mark-512.png brand/avatar-512.png
          cp brand/zift-mark-128.png brand/avatar-128.png
          cp brand/zift-mark-180.png brand/apple-touch-icon.png
          convert brand/zift-mark-16.png brand/zift-mark-32.png brand/zift-mark-48.png brand/favicon.ico
          cp brand/favicon.ico favicon.ico

      - name: Compose banner and social card
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageDraw, ImageFont

          def find(*names):
              # Do not trust a hard-coded font path. Search, and if nothing
              # is found say exactly what was tried instead of silently
              # falling back to a bitmap default that ruins the artwork.
              roots = ("/usr/share/fonts/**/%s", "/usr/local/share/fonts/**/%s")
              for n in names:
                  for r in roots:
                      hits = glob.glob(r % n, recursive=True)
                      if hits:
                          return hits[0]
              raise SystemExit(f"font not found, tried: {names}")

          MONO_B = find("DejaVuSansMono-Bold.ttf", "DejaVuSans-Bold.ttf")
          MONO_R = find("DejaVuSansMono.ttf", "DejaVuSans.ttf")
          print("bold:", MONO_B, "\nreg :", MONO_R)
          bold = lambda s: ImageFont.truetype(MONO_B, s)
          reg = lambda s: ImageFont.truetype(MONO_R, s)

          BG = (11, 11, 11)
          SIGNAL = (255, 77, 79)
          OFF = (245, 242, 234)
          DIM = (140, 140, 134)

          art = Image.open("brand/zift-1024.png").convert("RGBA")

          def fit(h):
              w = round(art.width * h / art.height)
              return art.resize((w, h), Image.LANCZOS)

          # --- X / GitHub banner 1500x500 ---
          b = Image.new("RGB", (1500, 500), BG)
          a = fit(420); b.paste(a, (110, 40), a)
          d = ImageDraw.Draw(b)
          d.text((560, 168), "ZIFT", font=bold(92), fill=OFF)
          d.line((565, 286, 1330, 286), fill=SIGNAL, width=3)
          d.text((563, 308), "kanitlanmamis iddiayi denetler", font=reg(30), fill=SIGNAL)
          d.text((563, 352), "evidence over adjectives  /  nothing quietly fixed",
                 font=reg(24), fill=DIM)
          b.save("brand/banner-1500x500.png")

          # --- Open Graph card 1200x630 ---
          o = Image.new("RGB", (1200, 630), BG)
          a = fit(460); o.paste(a, (90, 85), a)
          d = ImageDraw.Draw(o)
          d.text((530, 232), "ZIFT", font=bold(92), fill=OFF)
          d.line((535, 352, 1120, 352), fill=SIGNAL, width=3)
          d.text((533, 376), "kanitlanmamis iddiayi", font=reg(30), fill=SIGNAL)
          d.text((533, 414), "denetler", font=reg(30), fill=SIGNAL)
          d.text((533, 470), "umutseve4.github.io", font=reg(24), fill=DIM)
          o.save("brand/og-1200x630.png")
          print("banner + og composed")
          PY

      - name: Prove the mark survives shrinking
        run: |
          python3 - <<'PY'
          from PIL import Image
          # The whole point of the signal slits is that they stay readable
          # when the avatar is 32px in a timeline. Measure, do not assume.
          rows, fails = [], []
          for s in (512, 180, 128, 48, 32, 16):
              im = Image.open(f"brand/zift-mark-{s}.png").convert("RGBA")
              px = im.load()
              signal = sum(
                  1
                  for y in range(im.height)
                  for x in range(im.width)
                  if px[x, y][3] > 60
                  and px[x, y][0] > 120
                  and px[x, y][0] - px[x, y][2] > 45
              )
              pct = 100 * signal / (im.width * im.height)
              rows.append(f"| {s}px | {pct:.2f}% |")
              print(f"{s:>4}px  signal {pct:5.2f}%")
              if s >= 32 and pct < 1.0:
                  fails.append((s, round(pct, 2)))
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### ZIFT legibility\n\n| size | signal |\n|---|---|\n")
              f.write("\n".join(rows) + "\n")
          if fails:
              raise SystemExit(f"signal vanished at {fails} - the mark is not legible")
          print("legibility gate passed")
          PY

      - name: Wire the brand into the site head
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          BEGIN = "<!-- zift:brand:begin - generated by brand-assets.yml -->"
          END = "<!-- zift:brand:end -->"
          BASE = "https://umutseve4.github.io"

          # Built as a list on purpose: a triple-quoted literal here would
          # have to out-dent below the YAML block scalar and silently break
          # the workflow file itself.
          block = "\n".join([
              BEGIN,
              '  <link rel="icon" href="/favicon.ico" sizes="any">',
              '  <link rel="icon" type="image/svg+xml" href="/brand/zift-mark.svg">',
              '  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">',
              f'  <meta property="og:image" content="{BASE}/brand/og-1200x630.png">',
              '  <meta property="og:image:width" content="1200">',
              '  <meta property="og:image:height" content="630">',
              '  <meta name="twitter:card" content="summary_large_image">',
              f'  <meta name="twitter:image" content="{BASE}/brand/og-1200x630.png">',
              "  " + END,
          ])

          p = pathlib.Path("index.html")
          html = p.read_text(encoding="utf-8")

          if BEGIN in html:
              # Replace in place so re-runs update the block instead of
              # stacking duplicate tags on every push.
              html = re.sub(
                  re.escape(BEGIN) + r".*?" + re.escape(END),
                  block.strip(), html, count=1, flags=re.S,
              )
              print("brand block refreshed")
          else:
              if "</head>" not in html:
                  sys.exit("index.html has no </head> - refusing to guess")
              html = html.replace("</head>", block + "\n</head>", 1)
              print("brand block inserted")

          p.write_text(html, encoding="utf-8")

          out = p.read_text(encoding="utf-8")
          assert out.count(BEGIN) == 1, "begin marker not unique"
          assert out.count(END) == 1, "end marker not unique"
          assert out.count('property="og:image"') == 1, "duplicate og:image"
          print("head wiring verified")
          PY

      - name: Commit generated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brand favicon.ico index.html
          if git diff --cached --quiet; then
            echo "assets already current"
          else
            git commit -m "brand: regenerate assets and wire the site head [skip ci]"
            git push
          fi

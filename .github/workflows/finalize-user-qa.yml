name: Finalize requested QA changes
on: push
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'ci: finalize requested QA changes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/restore-premium-motion
      - name: Build exact requested commit from approved base
        env:
          BASE: aad62d21683da71341a88bafe6875f9e033e0413
        run: |
          set -euo pipefail
          git config user.name 'Umut SEVER'
          git config user.email '2404005065@ogrenci.sbu.edu.tr'
          git switch --detach "$BASE"
          python3 - <<'PY'
          from pathlib import Path

          proof = Path('proof/index.html')
          text = proof.read_text()
          old = 'target="_blank" rel="noopener"'
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly two proof repository links, found {text.count(old)}')
          proof.write_text(text.replace(old, 'target="_blank" rel="noopener noreferrer"'))

          home = Path('index.html')
          text = home.read_text()
          old = '<strong>v0.6.0</strong><span>documented release</span>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Enflasyonum release metric, found {text.count(old)}')
          home.write_text(text.replace(old, '<strong>3.11+</strong><span>Python requirement</span>'))

          tests = Path('tests/site.spec.mjs')
          text = tests.read_text()
          marker = "test('proof uses immutable source URLs'"
          if text.count(marker) != 1:
              raise SystemExit('proof test marker missing or duplicated')
          tablet = """test('tablet project cards stay separated and contain every direct child',async({page},testInfo)=>{test.skip(testInfo.project.name!=='tablet-768');await page.emulateMedia({reducedMotion:'reduce'});await page.goto('/');expect(page.viewportSize()).toEqual({width:768,height:1024});await page.evaluate(()=>document.fonts.ready);const cards=page.locator('#work .project');await expect(cards).toHaveCount(4);const violations=await cards.evaluateAll(nodes=>{const tolerance=1;const rects=nodes.map(node=>node.getBoundingClientRect());const issues=[];for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++){const overlapX=Math.min(rects[i].right,rects[j].right)-Math.max(rects[i].left,rects[j].left);const overlapY=Math.min(rects[i].bottom,rects[j].bottom)-Math.max(rects[i].top,rects[j].top);if(overlapX>tolerance&&overlapY>tolerance)issues.push(`cards ${i+1} and ${j+1} overlap by ${overlapX.toFixed(2)}x${overlapY.toFixed(2)}px`)}nodes.forEach((card,cardIndex)=>{const cardRect=rects[cardIndex];[...card.children].forEach((child,childIndex)=>{const style=getComputedStyle(child);const childRect=child.getBoundingClientRect();const opacity=Number.parseFloat(style.opacity);if(style.display==='none'||style.visibility==='hidden'||!(opacity>0)||!(childRect.width>0)||!(childRect.height>0))return;if(childRect.left<cardRect.left-tolerance||childRect.top<cardRect.top-tolerance||childRect.right>cardRect.right+tolerance||childRect.bottom>cardRect.bottom+tolerance)issues.push(`card ${cardIndex+1} child ${childIndex+1} (${child.className||child.tagName}) escapes card bounds`)})});return issues});expect(violations).toEqual([])});\n"""
          tests.write_text(text.replace(marker, tablet + marker))
          PY
          git add proof/index.html index.html tests/site.spec.mjs
          git diff --cached --check
          git commit -m 'fix: harden evidence links and tablet card QA'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify static checks
        run: npm ci && npm test
      - name: Verify tablet geometry
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=tablet-768 --grep 'tablet project cards stay separated'
      - name: Publish as the sole commit after approved base
        env:
          BRANCH: fix/restore-premium-motion
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            expected=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
            if git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "$FINAL_SHA:refs/heads/$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Branch remained busy; refusing an unsafe force push.' >&2
          exit 1

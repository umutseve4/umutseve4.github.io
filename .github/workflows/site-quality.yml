name: site-quality
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test

  browser:
    name: browser-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: recruiter
            grep: "core recruiter UX|contact targets"
          - id: fallback
            grep: "keyboard skip link|JavaScript-off fallback"
          - id: content
            grep: "cold-start limits|tablet project cards|proof uses immutable"
          - id: motion-init
            grep: "normal motion initializes|reduced motion suppresses"
          - id: tilt
            grep: "fine-pointer card tilt"
          - id: raf-lifecycle
            grep: "offscreen hero pauses"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        id: browser_tests
        run: npm run test:browser -- --grep "${{ matrix.grep }}"
      - name: Upload browser failure diagnostics
        if: ${{ !cancelled() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          overwrite: false
